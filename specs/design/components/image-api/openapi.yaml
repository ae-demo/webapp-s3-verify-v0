openapi: 3.0.3
info:
  title: Image API
  version: 0.1.0
  description: Manages image metadata and issues presigned S3 URLs for upload and view. Image bytes never pass through this service.
servers:
  - url: /
paths:
  /me/images:
    get:
      operationId: listMyImages
      summary: The caller's uploaded images
      security:
        - oauth2: [images:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: A page of the caller's images
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Image' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/images/upload-url:
    post:
      operationId: requestImageUploadUrl
      summary: Request a presigned S3 upload URL for a new image
      security:
        - oauth2: [images:upload]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType]
              properties:
                fileName: { type: string }
                contentType: { type: string }
      responses:
        '201':
          description: Presigned upload URL and the pending image record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadUrlResponse' }
        '400':
          description: Invalid file name or content type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/images/{imageId}/complete:
    post:
      operationId: completeImageUpload
      summary: Confirm the image bytes have been uploaded to S3
      security:
        - oauth2: [images:upload]
      parameters:
        - name: imageId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sizeBytes]
              properties:
                sizeBytes: { type: integer }
      responses:
        '200':
          description: The completed image record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Image' }
        '404':
          description: No pending upload with this id for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/images/{imageId}:
    get:
      operationId: getMyImage
      summary: The caller's image metadata
      security:
        - oauth2: [images:read]
      parameters:
        - name: imageId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The image metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Image' }
        '404':
          description: No such image for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/images/{imageId}/view-url:
    get:
      operationId: getImageViewUrl
      summary: A presigned S3 URL to view the caller's image at full size
      security:
        - oauth2: [images:read]
      parameters:
        - name: imageId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The presigned view URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViewUrlResponse' }
        '404':
          description: No such image for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            images:read: The caller's own uploaded images
            images:upload: Request an upload URL and record a new image
  schemas:
    Image:
      type: object
      required: [id, fileName, contentType, uploadedAt, status]
      properties:
        id: { type: string }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        status: { type: string, enum: [pending, stored] }
        uploadedAt: { type: string, format: date-time }
    UploadUrlResponse:
      type: object
      required: [imageId, uploadUrl]
      properties:
        imageId: { type: string }
        uploadUrl: { type: string, description: presigned S3 PutObject URL, short-lived }
    ViewUrlResponse:
      type: object
      required: [viewUrl]
      properties:
        viewUrl: { type: string, description: presigned S3 GetObject URL }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
security:
  - oauth2: []
